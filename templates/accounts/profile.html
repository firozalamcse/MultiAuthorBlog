{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h3>My Profile</h3>
        </div>

        <div class="card-body">

            {% if user.profile_picture %}
                <img src="{{ user.profile_picture.url }}"
                     class="img-thumbnail mb-3"
                     width="180">
            {% endif %}

            <table class="table table-bordered">

                <tr>
                    <th>Username</th>
                    <td>{{ user.username }}</td>
                </tr>

                <tr>
                    <th>First Name</th>
                    <td>{{ user.first_name }}</td>
                </tr>

                <tr>
                    <th>Last Name</th>
                    <td>{{ user.last_name }}</td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td>{{ user.email }}</td>
                </tr>

                <tr>
                    <th>Bio</th>
                    <td>{{ user.bio }}</td>
                </tr>

            </table>

        </div>

    </div>

</div>

{% endblock %}
