{% extends 'base.html' %}


{% block title %}
Login
{% endblock %}



{% block content %}



<div class="container mt-5" style="max-width:600px;">



    <div class="card shadow">


        <div class="card-header bg-success text-white text-center">

            <h3>
                Login
            </h3>

        </div>




        <div class="card-body">



            <form method="POST">


                {% csrf_token %}


                {{ form.as_p }}



                <button 
                type="submit" 
                class="btn btn-success w-100">

                    Login

                </button>



            </form>



        </div>



    </div>



</div>




{% endblock %}
