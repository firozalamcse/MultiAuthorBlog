<!DOCTYPE html>
<html>

<head>
    <title>Update Blog</title>
</head>

<body>

<h1>Update Blog</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Update Blog
    </button>

</form>

<br>

<a href="{% url 'blog_detail' blog.slug %}">
    Cancel
</a>

</body>

</html>
